name: Build & Release Multi-Platform Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Versions-Tag (z. B. v1.7.0-beta.1 - leer lassen für aktuellen Git-Tag/Branch)'
        required: false
        default: ''
      is_prerelease:
        description: 'Als Pre-Release / Beta markieren'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. ANDROID BUILD (APK)
  # =========================================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Prepare APK Artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/PokeVault-Android.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokeVault-Android
          path: dist/PokeVault-Android.apk
          retention-days: 2

  # =========================================================================
  # 2. WINDOWS BUILD (ZIP)
  # =========================================================================
  build-windows:
    name: Build Windows x64 (Zip)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Application
        run: flutter build windows --release

      - name: Package Windows Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $releaseDir = "build\windows\x64\runner\Release"
          Compress-Archive -Path "$releaseDir\*" -DestinationPath "dist\PokeVault-Windows-x64.zip" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokeVault-Windows-x64
          path: dist/PokeVault-Windows-x64.zip
          retention-days: 2

  # =========================================================================
  # 3. LINUX BUILD (TAR.GZ & APPIMAGE)
  # =========================================================================
  build-linux:
    name: Build Linux (Tar.gz & AppImage)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            libsqlite3-dev libgl1-mesa-dev libegl1-mesa-dev appstream \
            libfuse2 desktop-file-utils python3-pip patchelf
          sudo pip3 install appimage-builder

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Linux Application
        run: flutter build linux --release

      - name: Package Standalone Tar.gz
        run: |
          mkdir -p dist
          tar -czvf dist/PokeVault-Linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Build AppImage
        continue-on-error: true
        run: |
          appimage-builder --recipe AppImageBuilder.yml --skip-test || true
          if [ -f "PokeVault-x86_64.AppImage" ]; then
            cp PokeVault-x86_64.AppImage dist/
          fi

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PokeVault-Linux
          path: dist/*
          retention-days: 2

  # =========================================================================
  # 4. PUBLISH RELEASE / PRE-RELEASE
  # =========================================================================
  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download all Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets/
          merge-multiple: true

      - name: Determine Pre-Release Status and Tag
        id: release_meta
        run: |
          TAG_NAME="${{ github.event.inputs.version_tag }}"
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME="${{ github.ref_name }}"
          fi

          IS_PRE="false"
          if [[ "$TAG_NAME" == *"-beta"* ]] || [[ "$TAG_NAME" == *"-rc"* ]] || [[ "${{ github.event.inputs.is_prerelease }}" == "true" ]]; then
            IS_PRE="true"
          fi

          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRE" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.tag_name }}
          prerelease: ${{ steps.release_meta.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
