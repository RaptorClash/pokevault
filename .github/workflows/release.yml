name: Build & Release Multi-Platform Packages

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Versions-Tag (z. B. v1.7.0-beta.1 - leer lassen für aktuellen Git-Tag/Branch)'
        required: false
        default: ''
      is_prerelease:
        description: 'Als Pre-Release / Beta markieren'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # =========================================================================
  # 0. RELEASE GATE & TRIGGER EVALUATION
  # =========================================================================
  check-release-needed:
    name: Check Release Trigger Condition
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.gate.outputs.should_release }}
      target_tag: ${{ steps.gate.outputs.target_tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Evaluate Release Gate
        id: gate
        shell: bash
        run: |
          EVENT="${{ github.event_name }}"
          REF_NAME="${{ github.ref_name }}"
          TAG_INPUT="${{ github.event.inputs.version_tag }}"
          
          echo "Evaluating release trigger: event=$EVENT, ref=$REF_NAME, tag_input=$TAG_INPUT"
          
          # 1. Manual trigger (workflow_dispatch) always executes
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Manual workflow dispatch -> Release enabled."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          # 2. Tag push (v*) always executes
          if [[ "$REF_NAME" =~ ^v[0-9] ]]; then
            echo "Direct tag push ($REF_NAME) -> Release enabled."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "target_tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          # 3. Push to main: only execute if target version tag does not already exist
          git fetch --tags --force || true
          PUBSPEC_VER=$(python3 -c "import re; print(re.search(r'^version:\s*([^\s+]+)', open('pubspec.yaml').read(), re.M).group(1))")
          TARGET_TAG="v$PUBSPEC_VER"
          echo "Target tag for current pubspec version on main: $TARGET_TAG"
          echo "target_tag=$TARGET_TAG" >> "$GITHUB_OUTPUT"
          
          if git rev-parse "refs/tags/$TARGET_TAG" >/dev/null 2>&1; then
            echo "::notice ::Release tag $TARGET_TAG already exists in repository. Skipping build & release on main to prevent unintentional overwrites."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release tag $TARGET_TAG does not exist yet -> New release detected on main! Release enabled."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  # =========================================================================
  # 1. ANDROID BUILD (APK)
  # =========================================================================
  build-android:
    name: Build Android APK
    needs: [check-release-needed]
    if: needs.check-release-needed.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Prepare APK Artifact
        run: |
          mkdir -p dist
          VERSION=$(python3 -c "import re; print(re.search(r'^version:\s*([^\s+]+)', open('pubspec.yaml').read(), re.M).group(1))")
          cp build/app/outputs/flutter-apk/app-release.apk "dist/PokeVault_V${VERSION}.apk"

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokeVault-Android
          path: dist/*
          retention-days: 2

  # =========================================================================
  # 2. WINDOWS BUILD (ZIP)
  # =========================================================================
  build-windows:
    name: Build Windows x64 (Zip)
    needs: [check-release-needed]
    if: needs.check-release-needed.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Application
        run: flutter build windows --release

      - name: Package Windows Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([^\s+]+)').Matches.Groups[1].Value
          $releaseDir = "build\windows\x64\runner\Release"
          Compress-Archive -Path "$releaseDir\*" -DestinationPath "dist\PokeVault_V${version}_Windows.zip" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokeVault-Windows-x64
          path: dist/*
          retention-days: 2

  # =========================================================================
  # 3. LINUX BUILD (TAR.GZ & APPIMAGE)
  # =========================================================================
  build-linux:
    name: Build Linux (Tar.gz & AppImage)
    needs: [check-release-needed]
    if: needs.check-release-needed.outputs.should_release == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            libsqlite3-dev libgl1-mesa-dev libegl1-mesa-dev appstream \
            libfuse2 desktop-file-utils python3-pip patchelf
          sudo pip3 install appimage-builder

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Linux Application
        run: flutter build linux --release

      - name: Package Standalone Tar.gz
        run: |
          mkdir -p dist
          VERSION=$(python3 -c "import re; print(re.search(r'^version:\s*([^\s+]+)', open('pubspec.yaml').read(), re.M).group(1))")
          tar -czvf "dist/PokeVault_V${VERSION}.tar.gz" -C build/linux/x64/release/bundle .

      - name: Build AppImage
        continue-on-error: true
        run: |
          appimage-builder --recipe AppImageBuilder.yml --skip-test || true
          if [ -f "PokeVault-x86_64.AppImage" ]; then
            VERSION=$(python3 -c "import re; print(re.search(r'^version:\s*([^\s+]+)', open('pubspec.yaml').read(), re.M).group(1))")
            cp PokeVault-x86_64.AppImage "dist/PokeVault_V${VERSION}.AppImage"
          fi

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PokeVault-Linux
          path: dist/*
          retention-days: 2

  # =========================================================================
  # 4. PUBLISH RELEASE / PRE-RELEASE
  # =========================================================================
  publish-release:
    name: Publish GitHub Release
    needs: [check-release-needed, build-android, build-windows, build-linux]
    if: needs.check-release-needed.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download all Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets/
          merge-multiple: true

      - name: Determine Release Metadata
        id: release_meta
        run: |
          python3 tool/extract_release_info.py \
            --ref "${{ github.ref_name }}" \
            --tag-input "${{ github.event.inputs.version_tag }}" \
            --prerelease-input "${{ github.event.inputs.is_prerelease }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.release_title }}
          body_path: ${{ steps.release_meta.outputs.body_path }}
          prerelease: ${{ steps.release_meta.outputs.is_prerelease == 'true' }}
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
