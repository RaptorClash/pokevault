name: Deploy Flutter Web to GitHub Pages

on:
  # Startet automatisch bei jedem neuen Release
  release:
    types: [published]
  # Erlaubt es dir, die Action jederzeit manuell per Knopfdruck zu starten
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web App
        # Die base-href sagt Flutter, dass die App unter /pokevault/ läuft
        run: flutter build web --base-href "/pokevault/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web